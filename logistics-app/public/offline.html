<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Logistics – Offline</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:#0e1424; color:#e8ecf6; font-family:system-ui,"Segoe UI",Arial,sans-serif; text-align:center; }
  img { width:96px; height:96px; border-radius:22px; }
  h1 { margin:20px 0 8px; font-size:1.4rem; }
  p { margin:0 0 6px; color:#9aa6c4; line-height:1.5; max-width:34ch; }
  button { margin-top:20px; padding:12px 28px; border:0; border-radius:10px; background:#4f7bff; color:#fff; font:inherit; font-weight:600; cursor:pointer; }
</style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Logistics needs an internet connection. Check your mobile data or Wi-Fi, then try again.</p>
    <p lang="tl">Kailangan ng Logistics ng internet. Tingnan ang iyong mobile data o Wi-Fi, saka subukang muli.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>

</html>
